name: Build and test

on:
  push:
    branches:
      - main
      - dev/**
  pull_request:
  workflow_dispatch:

jobs:
  marker-state-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
