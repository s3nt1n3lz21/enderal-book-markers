name: Build and test

on:
  push:
    branches:
      - main
      - dev/**
  pull_request:
  workflow_dispatch:

jobs:
  marker-state-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Test C++ state
        run: ctest --test-dir build --output-on-failure
      - name: Test icon generator and build SWF
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tools/build_icon.py build/BookMarker.swf

  windows-plugin-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 4b308f5ccd45aed57f2977257bca304dfef43c99
          path: vcpkg
      - name: Bootstrap vcpkg
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
      - name: Configure plugin
        run: cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake"
        shell: pwsh
      - name: Build plugin
        run: cmake --build build --config Release --parallel
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage Vortex test package
        shell: pwsh
        run: |
          $root = "dist/EnderalBookMarkers"
          New-Item -ItemType Directory -Force "$root/SKSE/Plugins/DIII", "$root/Interface/EnderalBookMarkers" | Out-Null
          $plugin = Get-ChildItem -Path build -Filter EnderalBookMarkers.dll -Recurse | Select-Object -First 1
          if (-not $plugin) { throw "EnderalBookMarkers.dll was not produced" }
          Copy-Item $plugin.FullName "$root/SKSE/Plugins/EnderalBookMarkers.dll"
          Copy-Item "Data/SKSE/Plugins/DIII/EnderalBookMarkers.json" "$root/SKSE/Plugins/DIII/EnderalBookMarkers.json"
          python tools/build_icon.py "$root/Interface/EnderalBookMarkers/BookMarker.swf"
          Compress-Archive -Path "$root/*" -DestinationPath "dist/EnderalBookMarkers-test.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: EnderalBookMarkers-test-package
          path: dist/EnderalBookMarkers-test.zip
          if-no-files-found: error
